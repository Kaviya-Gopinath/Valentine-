<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Valentine's Day ❤️</title>

<style>
body{
    margin:0;
    padding:0;
    text-align:center;
    font-family:Arial, sans-serif;
    color:white;
    background:url("couple.jpg") no-repeat center center fixed;
    background-size:cover;
}

.container{
    background:rgba(0,0,0,0.6);
    padding:50px;
    min-height:100vh;
}

h1{
    font-size:45px;
    color:#ff66cc;
    text-shadow:0 0 15px pink,0 0 25px hotpink;
}

p{
    font-size:18px;
}

/* Message box */
.messageLabel{
    display:none;
    margin-top:30px;
    padding:30px;
    border-radius:15px;
    width:90%;
    margin-left:auto;
    margin-right:auto;
    box-shadow:0 0 25px pink;
    line-height:1.6;
    color:white;

    /*background: url("couple.jpg") no-repeat center center;*/
    background-size: cover;
    position: relative;
    
}

/* Dark overlay for readability */
.messageLabel::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    border-radius:15px;
    font-weight: bold;
}

.messageLabel *{
    position:relative;
    z-index:2;
}

/* Heart Button */
.heart-button{
    position:relative;
    width:40px;
    height:40px;
    background-color:red;
    border:none;
    cursor:pointer;
    transform:rotate(-45deg);
    margin-top:20px;
}

.heart-button::before,
.heart-button::after{
    content:"";
    position:absolute;
    width:40px;
    height:40px;
    background-color:red;
    border-radius:50%;
}

.heart-button::before{
    top:-20px;
    left:0;
}

.heart-button::after{
    left:20px;
    top:0;
}

.heart-button:active{
    transform:scale(0.9) rotate(-45deg);
}
</style>
</head>

<body>

<div class="container">

<h1>💌</h1>

<h1><strong><p>
Baby, I want to tell you something… touch the red heart  <br>
</p></strong></h1>

<button class="heart-button" onclick="showMessage()"></button>

<label class="messageLabel" id="loveMessage">
<strong>💖 My Athaan 💖 <br><br>


    The first LinkedIn message I received from you was just a simple “Hi, hello.”    
    At that time, I never knew that one small message would change my life so beautifully.

<br>  
        I never expected anything, but what I received from you was double and triple the happiness I ever imagined ✨    
<br>  
        You are so cool and funny when you talk to me.  <br>  
        You are my friend, my husband, my boyfriend — you are everything in one person.  <br>  
        What more do I need in my life?  🫂  
<br><br>  
        I like you sooooo much 😘  <br>  
        I love you so much, Athaan ❤️    
<br><br>  
        If I have ever made any mistake, please forgive me.  <br>  
        If I have ever spoken wrongly, I am truly sorry.    
<br><br>  
        I will never leave you.  <br>  
        I cannot imagine my life without you.    
<br><br>  
        Sometimes I fight with you in chat even after saying all these sweet things 😅  <br>  
        Please don’t take it seriously. That’s just me being me. Adjust panniko 😜    <br><br>  
    <strong>Happy Valentine’s Day, my Athaan ❤️💌</strong>  </strong>
</label>  

<audio id="bgMusic" loop>
<source src="love.mp3" type="audio/mpeg">
</audio>

</div>

<script>
var heartClicked = false;

function showMessage(){
    var msg = document.getElementById("loveMessage");
    var music = document.getElementById("bgMusic");

    heartClicked = !heartClicked;

    if(heartClicked){
        msg.style.display = "block";
        music.play();
    } else{
        msg.style.display = "none";
        music.pause();
        music.currentTime = 0;
    }
}
</script>

</body>
</html>
